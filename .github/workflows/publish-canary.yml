name: Publish --canary

# This workflow does not reach npm. Publishing is stage-only now: CI can only put a
# version in npm's staged queue, and a maintainer has to approve it with 2FA. This
# workflow runs on every push to main, so there is nobody to approve each canary, and
# staging them would just fill the queue with versions nobody will ever release. The
# npm step has in fact been commented out since v0.2.5 — `zshy@canary` still points at
# 0.0.15-canary.20250710T073403 — so this only makes the existing state explicit.
#
# To ship a canary again, either stage one by hand or give this workflow a trigger a
# human is present for.

on:
  push:
    branches:
      - main
  
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  publish:
    name: Main
    runs-on: ubuntu-latest
    
    permissions:
      # No id-token: nothing here authenticates to npm, and an unused OIDC identity on a
      # workflow that runs repo code on every push to main is surface for nothing.
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build
