name: Publish --latest

on:
  # Dispatch only, and deliberately so. A `workflow_dispatch` needs a GitHub session or token
  # carrying write access; a stolen git push credential carries neither, so it can no longer start a
  # release by landing a commit. That is the shape of the 2026-09-21 nubjs/nub compromise, where a
  # stolen push credential cut a tag and 18 packages published unattended. Bumping the version on
  # main is therefore inert until a maintainer runs `gh workflow run publish-latest.yml -R
  # colinhacks/zshy`, and the staged version then still needs their 2FA approval before npm serves
  # it. The version is still read from VERSION.txt, so what ships is unchanged; only the trigger is.
  #
  # ONE RUN, THREE JOBS. `stage` tests, builds and puts the version in npm's staged queue.
  # `approval` is a job on the `release-approval` environment, whose required reviewer is the
  # maintainer: GitHub holds the run there, with no runner, for up to 30 days. The npm approval is
  # the gate; the environment approval only resumes the run, and `finish` checks the registry before
  # it tags or releases anything. `stager approve` does both, approving on npm and then resuming the
  # run, which it finds by the version in package.json at the run's commit — hence the check below
  # that package.json and VERSION.txt agree.
  workflow_dispatch:

# Default-deny; each job asks for what its steps use.
permissions: {}

# One release at a time, held across the approval wait, so a second dispatch queues instead of
# staging next to a held run. Never cancelled: a run mid-`npm stage publish` must finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage
    runs-on: ubuntu-latest
    # This job only tests, builds and stages; the wait for the approval is the `approval` job,
    # which holds no runner.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for npm provenance and the OIDC trusted publisher
    outputs:
      version: ${{ steps.version.outputs.version }}
      # npm serves the version already (a re-dispatch after the approval), so there is nothing to
      # wait for and `approval` is skipped.
      served: ${{ steps.served.outputs.served }}

    steps:
      # A step, not a job-level `if:`: a skipped job is silent, and the run would go green having
      # released nothing while looking like it had.
      - name: Refuse to release from any ref but main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::publish-latest.yml runs from main only, got $GITHUB_REF"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # stager finds the run to resume by reading the version from package.json at the run's
      # commit, so a release commit bumps both files. Checked before anything is built or staged.
      - name: Check that VERSION.txt and package.json agree
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          pkg="$(node -p "require('./package.json').version")"
          [ "$version" = "$pkg" ] \
            || { echo "::error::VERSION.txt says $version but package.json says $pkg; bump both to the release version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing zshy@$version"

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Install an npm CLI that can stage
        # `npm stage publish` landed in npm 11.15; the npm bundled with setup-node lags it.
        run: | # zizmor: ignore[adhoc-packages] the npm CLI itself, pinned to the major that carries `npm stage`
          npm install -g npm@11
          v="$(npm --version)"
          # `sort -V | head -1` yields the smaller of the two; it must be the floor.
          [ "$(printf '%s\n11.15.0\n' "$v" | sort -V | head -1)" = "11.15.0" ] \
            || { echo "::error::npm $v cannot stage (need >= 11.15)"; exit 1; }
          echo "npm $v"

      - name: Run tests
        run: pnpm test

      - name: Build project
        run: pnpm build

      - name: Stage on npm
        # Stages the version through OIDC trusted publishing (id-token: write above). The
        # trusted publisher on zshy is stage-only, so this cannot publish: a maintainer
        # approves the staged version with 2FA, which is a proof of presence no stolen
        # credential can supply. There is no npm token to authenticate with any more.
        run: pnpm tsx versace.ts --latest --provenance --verbose

      - name: Check whether npm serves the version
        id: served
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(npm view "zshy@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "served=true" >> "$GITHUB_OUTPUT"
            echo "zshy@$VERSION is served already; no approval to wait for"
          else
            echo "served=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Say how to approve
        if: steps.served.outputs.served != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # shellcheck disable=SC2016  # the backticks below are markdown for the step summary, not command substitution
          {
            echo "## zshy@$VERSION is staged, waiting for approval"
            echo
            echo 'It is not installable until a maintainer approves it with 2FA. This run is now held on the `release-approval` environment, with no runner, for up to 30 days. It resumes when that deployment is approved, and `finish` then waits for npm to serve the version before it tags and creates the GitHub release.'
            echo
            echo '```'
            echo "stager approve 'zshy@$VERSION'   # approve in the browser, then resume this run"
            echo "stager reject 'zshy@$VERSION'    # drop the staged version and fail this run"
            echo '```'
            echo
            echo "Without stager: read the stage id with \`npm stage list zshy\` and approve it with \`npm stage approve <id>\`, or use \`pnpm stage approve\` (pnpm 12+) or the Staged Packages tab on npmjs.com. Then approve the pending \`release-approval\` deployment on $RUN_URL."
          } >> "$GITHUB_STEP_SUMMARY"

  approval:
    name: Approval
    # Held by the environment's required reviewer, not by a runner: GitHub keeps the run waiting
    # for up to 30 days, with no six-hour cap, until the deployment is approved. It is a resume
    # signal only; a version nobody approved on npm still stops `finish` at the registry check.
    needs: stage
    if: needs.stage.outputs.served != 'true'
    runs-on: ubuntu-latest
    environment: release-approval
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.stage.outputs.version }}
        run: echo "resuming; finish checks that npm serves zshy@$VERSION"

  finish:
    name: Finish
    needs: [stage, approval]
    # `approval` is skipped when npm already serves the version, and `finish` still runs then to
    # create whatever an earlier run did not. The explicit condition drops the implicit
    # `success()`, so `stage` is checked by name.
    if: ${{ !cancelled() && needs.stage.result == 'success' && (needs.approval.result == 'success' || (needs.approval.result == 'skipped' && needs.stage.outputs.served == 'true')) }}
    runs-on: ubuntu-latest
    # 6h is GitHub's hard cap for a hosted runner; the wait takes 340 minutes of it and the steps
    # after it need a few.
    timeout-minutes: 360
    permissions:
      contents: write
      pull-requests: read
    env:
      VERSION: ${{ needs.stage.outputs.version }}

    steps:
      # THE HUMAN GATE. The run resumes on the environment approval, which says nothing about npm,
      # so the changelog, the tag and the GitHub release wait here until the registry serves the
      # version; a release never exists for a version nobody approved. The loop also absorbs the
      # automated review npm runs once a version is approved, which has held zod releases for up
      # to two hours. If the approval comes later still, re-run this job.
      - name: Wait for npm to serve the version
        run: |
          deadline=$(( $(date +%s) + 340 * 60 ))
          i=0
          until [ "$(npm view "zshy@$VERSION" version 2>/dev/null)" = "$VERSION" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::zshy@$VERSION is still not served after 340 minutes; if it was never approved on npm, approve it with 2FA (stager approve 'zshy@$VERSION'), then re-run this job"
              exit 1
            fi
            i=$((i + 1))
            if [ $((i % 15)) -eq 0 ]; then echo "zshy@$VERSION is not served yet ($i minutes)"; fi
            sleep 60
          done
          echo "zshy@$VERSION is live on npm"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure changelog
        run: |
          # shellcheck disable=SC1083,SC2028,SC2140  # the expressions below emit the changelog action's own placeholders into single-quoted JSON
          echo '{"categories": [], "template": "## Commits:\n\n${{ '${{UNCATEGORIZED}}' }}", "pr_template": ${{ '"- ${{MERGE_SHA}} ${{TITLE}}"' }} }' > changelog_config.json
          cat changelog_config.json
          echo "last_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      # The run's commit rather than `github.ref`: main may have moved on while the run was held.
      - name: Generate changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@eff1e48187ab0f73c1da7b9980c4a85fc5e169bc # v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fromTag: "${{ env.last_tag }}"
          toTag: ${{ github.sha }}
          commitMode: true
          configuration: changelog_config.json

      # The notes go through env and a file so a commit subject cannot break out of the command.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.github_release.outputs.changelog }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          printf '%s' "$CHANGELOG" > "$RUNNER_TEMP/release_notes.md"
          # The job token cannot write a ref once main has moved past this commit with a workflow
          # change, which a run held for days makes likely.
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            || { echo "::error::could not create v$VERSION at $GITHUB_SHA with the job token; create it with your own (gh release create v$VERSION -R $GITHUB_REPOSITORY --target $GITHUB_SHA --title v$VERSION --generate-notes), then re-run this job"; exit 1; }
