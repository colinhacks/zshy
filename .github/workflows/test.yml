name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test with Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: pnpm test

      - name: Check for untracked changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Tests produced untracked git changes:"
            git status --porcelain
            exit 1
          fi

      - name: Build
        run: pnpm build

  # Runs the suite against TypeScript's nightly build, so a change to the
  # TypeScript 7 API or its emit shows up here before the devDependency is
  # bumped. Advisory: nightly churn must not block unrelated work. The main job
  # covers the pinned 7.1 release.
  typescript-next:
    name: TypeScript next (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node-version: 24

      - name: Install typescript@next
        run: pnpm add -D typescript@next --ignore-scripts

      - name: Print TypeScript version
        run: node -p "require('typescript/package.json').version"

      - name: Build zshy with zshy
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # Fixture output is committed, so upstream emit drift shows up as a diff
      - name: Show fixture drift
        if: always()
        run: git status --porcelain -- test
